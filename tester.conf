server {
    listen 8080;
    host 127.0.0.1;

    location / {
        root ./www;
        methods GET;
    }

    location /YoupiBanane {
        root ./YoupiBanane;
        methods GET POST;
        index youpi.bad_extension;
        cgi .bla ./cgi_test;
    }

    location /post_body {
        root ./www;
        methods POST;
        client_max_body_size 100;
    }

    location /directory {
        root ./YoupiBanane;
        methods GET;
        index youpi.bad_extension;
    }
}