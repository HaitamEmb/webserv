server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost webserv.local;
    error_page 404 ./www/404.html;

    location / {
	root ./www;
        index index.html;
        methods GET POST;
        autoindex on;
        client_max_body_size 2000000;
    }

    location /uploads {
        root ./www/uploads;
        methods GET POST DELETE;
        autoindex off;
        upload on;
        upload_store ./www/uploads;
        client_max_body_size 2000000;
    }

    location /cgi {
        root ./www/cgi;
        methods GET POST;
        cgi_extension .py;
        cgi_executor /usr/bin/python3;
        cgi .py /usr/bin/python3;
        cgi .sh /bin/sh;
        client_max_body_size 2000000;
    }

    location /redirect {
        methods GET;
        return 301 /;
    }

    location /session {
        root ./www;
        index index.html;
        methods GET;
        sessions on;
    }
}