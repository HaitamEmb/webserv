server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost webserv.local;

    location / {
	root ./www;
        index index.html;
        methods GET POST;
        autoindex on;
        client_max_body_size 2000000;
    }

    location /uploads {
        root ./www/uploads;
        methods POST DELETE;
        autoindex off;
    }
}